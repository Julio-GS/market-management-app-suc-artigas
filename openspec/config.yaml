# ── Phase Rules ────────────────────────────────────────────────────────────────

phase_rules:
  apply:
    - Must write tests FIRST (Strict TDD Mode)
    - Tests use vitest with temp-directory SQLite fixtures
    - All database operations must use parameterized queries
    - Outbox entries must be created in the same transaction as the business write
    - Every new IPC handler must have corresponding IPC tests
  verify:
    - Must read spec + tasks + apply-progress before reporting
    - All new database operations require migration tests
    - All IPC handlers must be verified against their spec
  archive:
    - Must verify all CRITICAL/blocking findings resolved before close

