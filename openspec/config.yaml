# ── Strict TDD ─────────────────────────────────────────────────────────────────

strict_tdd: true
strict_tdd_reason: |
  The project already has a comprehensive test suite (13 test files, 149 tests)
  using vitest with proper beforeEach/afterEach temp-database fixtures. Tests
  cover sales, products, sync engine, bootstrap, config, offline-state, and
  IPC handlers. The patterns are mature and well-established (temp directories,
  transactional outbox verification). All new code MUST follow the same pattern:
  database-backed vitest tests co-located with source.

# ── Project Conventions ────────────────────────────────────────────────────────

conventions:
  # All test files use vitest with Database-backed temp-dir fixtures.
  # See src/main/sales-local.test.ts and src/main/products-local.test.ts for reference.
  code_style:
    - strict TypeScript (strict: true in tsconfig)
    - ES2022 target with CommonJS modules
    - No ESLint/Prettier config detected; follow existing code patterns
  naming:
    - camelCase for variables and functions
    - PascalCase for types/interfaces
    - kebab-case for filenames
  imports:
    - Explicit type imports (import type Database from "better-sqlite3")
    - No barrel/index re-exports
    - UUID generation via node:crypto randomUUID
  database_patterns:
    - Database handle passed as parameter to all operations (dependency injection via function parameter)
    - Transactions via db.transaction(() => { ... })
    - Outbox pattern for offline writes (same transaction as the write)
    - Metadata table for app-level key/value state

